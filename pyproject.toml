[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkml-lib"
version = "0.1.0"
description = "Reusable LinkML and DataHarmonizer schema utilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MIMICC contributors" }
]
dependencies = [
  "linkml>=1.7",
  "linkml-runtime>=1.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
cli = [
  "typer>=0.9",
]

# Standardised dev group across the MIMICC/ENA repos; `uv sync` installs it by
# default, so CI needs no extra flag for it.
[dependency-groups]
dev = [
  "mypy>=1.14",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.16",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkml_lib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"

# linkml and linkml-runtime ship no py.typed marker.
[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime.*"]
ignore_missing_imports = true
